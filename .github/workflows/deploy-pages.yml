name: Deploy dashboard to GitHub Pages

# Publishes the static dashboard (index.html at the repo root) to GitHub Pages.
# Runs automatically on every push to the default branch, and can be triggered
# manually from the Actions tab. The first successful run enables Pages with the
# "GitHub Actions" source, so no manual Settings → Pages toggling is required.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed for the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
